# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# To move it to Aarya's own user site later (repo Aaryap1.github.io), set
# SITE_URL to https://aaryap1.github.io and BASE_PATH to / below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests read a root build, so check that first...
      - run: npm run build
      - run: npm test
      # ...then build for where Pages serves it.
      - run: npm run build
        env:
          SITE_URL: https://xanthrexx.github.io
          BASE_PATH: /aarya-portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
